# Build and release desktop apps
name: Build & Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: legacy/prototype/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: legacy/prototype

      - name: Build Windows app
        run: npm run build:win
        working-directory: legacy/prototype
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            legacy/prototype/release/*.exe
            legacy/prototype/release/*.msi
          retention-days: 30

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            legacy/prototype/release/*.exe
            legacy/prototype/release/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: legacy/prototype/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: legacy/prototype

      - name: Build Linux app
        run: npm run build:linux
        working-directory: legacy/prototype
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            legacy/prototype/release/*.AppImage
            legacy/prototype/release/*.deb
            legacy/prototype/release/*.snap
          retention-days: 30

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            legacy/prototype/release/*.AppImage
            legacy/prototype/release/*.deb
            legacy/prototype/release/*.snap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: legacy/prototype/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: legacy/prototype

      - name: Build macOS app
        run: npm run build:mac
        working-directory: legacy/prototype
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            legacy/prototype/release/*.dmg
            legacy/prototype/release/*.zip
          retention-days: 30

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            legacy/prototype/release/*.dmg
            legacy/prototype/release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
